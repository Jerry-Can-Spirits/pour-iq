<!--
  The Pour IQ mark: the site's hero pour signature, formalised. A thin
  vertical stroke descends from the top edge and resolves into the
  horizontal underline at the baseline, bottoms flush at the left end
  (mirroring .pour-underline::before/::after in app/globals.css: the
  2px vertical and 3px underline share the same bottom line, vertical at
  left 0). Stroke widths keep the CSS 2:3 ratio (4 and 6 at this scale).

  Colour: fill is currentColor so embedding contexts can restyle the
  mark; the root color attribute defaults it to the measure token,
  #D98E2B (lib/design-tokens.ts, colours.measure).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" color="#D98E2B" role="img" aria-label="Pour IQ mark">
  <rect fill="currentColor" x="10" y="0" width="4" height="52"/>
  <rect fill="currentColor" x="10" y="46" width="44" height="6"/>
</svg>
