<!--
  Single-colour Pour IQ mark for print and embeds: identical geometry to
  pour-mark.svg (centred pour over a level measure, strokes never
  touching - deliberately distinct from the hero pour's corner-join,
  which stays unchanged in the site CSS) but with no default colour; it
  renders entirely in currentColor.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pour IQ mark">
  <rect fill="currentColor" x="30" y="0" width="4" height="42"/>
  <rect fill="currentColor" x="6" y="48" width="52" height="6"/>
</svg>
