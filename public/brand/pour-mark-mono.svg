<!--
  Single-colour Pour IQ mark for print and embeds: identical geometry to
  pour-mark.svg but with no default colour — it renders entirely in
  currentColor, so it takes whatever text colour surrounds it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pour IQ mark">
  <rect fill="currentColor" x="10" y="0" width="4" height="52"/>
  <rect fill="currentColor" x="10" y="46" width="44" height="6"/>
</svg>
