<!--
  The Pour IQ mark on a cellar rounded-square tile, for contexts that
  need a contained mark: favicons, app icons, avatars. Corner radius 8
  is the radius-md token. Strokes are optically heavier than
  pour-mark.svg (6 and 9) so the mark survives 16px favicon rendering,
  but keep the same 2:3 vertical:horizontal ratio as the pour CSS, and
  the vertical is inset from the tile edge rather than bleeding off it.

  Colours from lib/design-tokens.ts: tile cellar #0F1D18, mark measure
  #D98E2B.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pour IQ mark">
  <rect fill="#0F1D18" x="0" y="0" width="64" height="64" rx="8"/>
  <rect fill="#D98E2B" x="14" y="12" width="6" height="38"/>
  <rect fill="#D98E2B" x="14" y="41" width="36" height="9"/>
</svg>
