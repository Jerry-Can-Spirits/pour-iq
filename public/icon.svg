<!--
  The Pour IQ mark on a cellar rounded-square tile, for contexts that
  need a contained mark: favicons, app icons, avatars. Corner radius 8
  is the radius-md token. The vertical pours down the centre and stops
  one horizontal stroke-width clear of the level measure below - the
  strokes never touch. Deliberately distinct from the hero pour's
  corner-join (unchanged in the site CSS), which reads as an L out of
  context. Strokes are optically heavier than pour-mark.svg (6 and 9)
  so the mark survives 16px favicon rendering, keeping the same 2:3
  vertical:horizontal ratio as the pour CSS.

  Colours from lib/design-tokens.ts: tile cellar #0F1D18, mark measure
  #D98E2B.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pour IQ mark">
  <rect fill="#0F1D18" x="0" y="0" width="64" height="64" rx="8"/>
  <rect fill="#D98E2B" x="29" y="9" width="6" height="24"/>
  <rect fill="#D98E2B" x="8" y="42" width="48" height="9"/>
</svg>
